name: Build OKE Cilium Image

on:
  push:
    branches:
      - oke-cni-chaining-test
    paths:
      - 'plugins/cilium-cni/**'
      - 'images/cilium/Dockerfile.oke'
      - '.github/workflows/build-oke-image.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/cilium/Dockerfile.oke
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cilium:oke-cni-chaining
            ghcr.io/${{ github.repository_owner }}/cilium:oke-cni-chaining-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
